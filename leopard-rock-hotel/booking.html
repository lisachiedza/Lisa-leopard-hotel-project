<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking | Leopard Rock Hotel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="logo" href="index.html">LEOPARD ROCK HOTEL</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="booking.html" class="active">Booking</a>
    <a href="contact.html">Contact Us</a>
  </nav>
</header>
<section>
  <h2>Book a Room</h2>
  <div id="message" class="message"></div>
  <form id="bookingForm">
    <label for="full_name">Full Name</label>
    <input type="text" id="full_name" name="full_name" required>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" required>
    <label for="room_type">Room Type</label>
    <select id="room_type" name="room_type" required>
      <option value="Standard">Standard Room</option>
      <option value="Deluxe">Deluxe Room</option>
      <option value="Family">Family Room</option>
    </select>
    <label for="check_in">Check-in</label>
    <input type="date" id="check_in" name="check_in" required>
    <label for="check_out">Check-out</label>
    <input type="date" id="check_out" name="check_out" required>
    <label for="guests">Guests</label>
    <input type="number" id="guests" name="guests" min="1" max="10" value="1" required>
    <button type="submit">Submit Booking</button>
  </form>
</section>
<footer>&copy; 2026 Leopard Rock Hotel. All rights reserved.</footer>
<script src="script.js"></script>
</body>
</html>
